                        child: Center(
                          child: SizedBox(
                            height: 420,
                            child: AspectRatio(
                              aspectRatio: player!.value.aspectRatio,
                              child: VideoPlayer(player!),
                            ),
                          ),
                        ),
                      ),
                    clipList(),
                    section('Titles (shown one at a time)'),
                    textEditor('Type a title, tap +', titles, titleCtl),
                    section('Captions (shown below the title)'),
                    textEditor('Type a caption, tap +', captions, captionCtl),
                    section('Text position (same for all titles and captions)'),
                    positionPicker(),
                    const SizedBox(height: 24),
                  ],
                ),
              );
            }
