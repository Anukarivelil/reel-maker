          EOF_4
          cat > setup.sh <<'EOF_5'
          #!/usr/bin/env bash
          # Run once, from inside the reel_maker folder, on a computer with Flutter installed.
          set -e
          flutter create --org com.local --project-name reel_maker --platforms android .

          # ffmpeg-kit needs Android minSdk 24+
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] && sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' "$f"
          done

          # Turn off the release lint check, which crashes on some plugin combinations
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '0,/^android {/s//android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i '0,/^android {/s//android {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }/' android/app/build.gradle
          fi

          # Allow saving to the gallery on Android 9 and below
          M=android/app/src/main/AndroidManifest.xml
          grep -q WRITE_EXTERNAL_STORAGE "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n    <application#' "$M"

          flutter pub get
          echo "Done. Connect your phone (USB debugging on) and run: flutter run --release"
          EOF_5
      - name: Build
        working-directory: app
        run: |
          bash setup.sh
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: reel-maker-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

