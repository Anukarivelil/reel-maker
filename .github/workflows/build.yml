name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create project files
        run: |
          mkdir -p app/lib && cd app
          cat > pubspec.yaml <<'EOF_0'
          name: reel_maker
          description: Offline auto reel maker - cleans, enhances and joins video clips.
          publish_to: "none"
          version: 1.0.0+1

          environment:
            sdk: ">=3.3.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            image_picker: any
            ffmpeg_kit_flutter_new: any
            image: any
            path_provider: any
            gal: any
            video_player: any

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
          EOF_0
          cat > lib/analyzer.dart <<'EOF_1'
          import 'dart:io';

          import 'package:ffmpeg_kit_flutter_new/ffmpeg_kit.dart';
          import 'package:ffmpeg_kit_flutter_new/ffprobe_kit.dart';
          import 'package:ffmpeg_kit_flutter_new/return_code.dart';
          import 'package:flutter/foundation.dart';
          import 'package:image/image.dart' as img;

          /// A good (sharp, well-exposed) piece of a clip.
          class Segment {
            final String clip;
            final double start;
            final double duration;
            final double score; // sharpness relative to the clip's median
            final double brightness; // 0..255 average luminance
            final bool hasAudio;

            const Segment({
              required this.clip,
              required this.start,
              required this.duration,
              required this.score,
              required this.brightness,
              required this.hasAudio,
            });
          }

          /// Seconds of video represented by one analysed frame.
          const double _step = 0.5; // frames sampled at 2 fps
          const double _minSegment = 1.0; // drop good runs shorter than this
          const double _maxSegment = 6.0; // keep reels punchy
          const double _fallbackLen = 3.0; // used when nothing in a clip is "good"

          /// Runs in a background isolate: [laplacian variance, mean luminance].
          List<double> _frameStats(String path) {
            final im = img.decodeJpg(File(path).readAsBytesSync());
            if (im == null) return [0, 0];
            final w = im.width, h = im.height;
            final g = List<double>.filled(w * h, 0);
            double sum = 0;
            for (var y = 0; y < h; y++) {
              for (var x = 0; x < w; x++) {
                final l = im.getPixel(x, y).luminanceNormalized.toDouble() * 255;
                g[y * w + x] = l;
                sum += l;
              }
            }
            double s = 0, s2 = 0;
            var n = 0;
            for (var y = 1; y < h - 1; y++) {
              for (var x = 1; x < w - 1; x++) {
                final c = y * w + x;
                final lap = 4 * g[c] - g[c - 1] - g[c + 1] - g[c - w] - g[c + w];
                s += lap;
                s2 += lap * lap;
                n++;
              }
            }
            final variance = n == 0 ? 0.0 : s2 / n - (s / n) * (s / n);
            return [variance, sum / (w * h)];
          }

          List<List<double>> _statsBatch(List<String> paths) =>
              paths.map(_frameStats).toList();

          Future<double> probeDuration(String path) async {
            final s = await FFprobeKit.getMediaInformation(path);
            final d = s.getMediaInformation()?.getDuration();
            return double.tryParse(d ?? '') ?? 0;
          }

          Future<bool> probeHasAudio(String path) async {
            final s = await FFprobeKit.getMediaInformation(path);
            final streams = s.getMediaInformation()?.getStreams() ?? [];
            return streams.any((st) => st.getType() == 'audio');
          }

          double _median(List<double> v) {
            final s = [...v]..sort();
            return s.isEmpty ? 0 : s[s.length ~/ 2];
          }

          /// Picks the [len]-second window in frames [a]..[b] with the best sharpness.
          (double, double) _bestWindow(
              List<double> sharp, int a, int b, double len, double dur) {
            final runSeconds = (b - a + 1) * _step;
            if (runSeconds <= len) {
              return (a * _step, (runSeconds).clamp(0, dur - a * _step).toDouble());
            }
            final frames = (len / _step).round();
            var bestStart = a;
            var bestSum = -1.0;
            for (var i = a; i + frames - 1 <= b; i++) {
              var sum = 0.0;
              for (var k = 0; k < frames; k++) {
                sum += sharp[i + k];
              }
              if (sum > bestSum) {
                bestSum = sum;
                bestStart = i;
              }
            }
            return (bestStart * _step, len);
          }

          /// Finds the usable parts of one clip: removes blurry, too-dark and
          /// blown-out stretches.
          Future<List<Segment>> analyzeClip(String clip, Directory work, int index) async {
            final dur = await probeDuration(clip);
            final audio = await probeHasAudio(clip);
            if (dur <= 0) return [];

            final dir = Directory('${work.path}/frames_$index')..createSync(recursive: true);
            final session = await FFmpegKit.executeWithArguments([
              '-y', '-i', clip,
              '-vf', 'fps=${1 / _step},scale=160:-2',
              '-q:v', '3',
              '${dir.path}/f_%04d.jpg',
            ]);
            if (!ReturnCode.isSuccess(await session.getReturnCode())) return [];

            final files = dir.listSync().whereType<File>().map((f) => f.path).toList()
              ..sort();
            if (files.isEmpty) return [];
            final stats = await compute(_statsBatch, files);
            final sharp = stats.map((s) => s[0]).toList();
            final lum = stats.map((s) => s[1]).toList();
            dir.deleteSync(recursive: true);

            final med = _median(sharp);
            final thr = med * 0.4 < 25 ? 25.0 : med * 0.4;
            final n = sharp.length;
            final good = List<bool>.generate(
                n, (i) => sharp[i] >= thr && lum[i] > 30 && lum[i] < 238);
            // Heal one-frame glitches so cuts don't get choppy.
            for (var i = 1; i < n - 1; i++) {
              if (!good[i] && good[i - 1] && good[i + 1]) good[i] = true;
            }

            double meanLum(int a, int b) =>
                lum.sublist(a, b + 1).reduce((x, y) => x + y) / (b - a + 1);
            double scoreOf(int a, int b) => med <= 0
                ? 1
                : (sharp.sublist(a, b + 1).reduce((x, y) => x + y) / (b - a + 1)) / med;

            Segment build(int a, int b, double len) {
              final (start, d) = _bestWindow(sharp, a, b, len, dur);
              return Segment(
                clip: clip,
                start: start,
                duration: d,
                score: scoreOf(a, b),
                brightness: meanLum(a, b),
                hasAudio: audio,
              );
            }

            final out = <Segment>[];
            var i = 0;
            while (i < n) {
              if (!good[i]) {
                i++;
                continue;
              }
              var j = i;
              while (j + 1 < n && good[j + 1]) {
                j++;
              }
              if ((j - i + 1) * _step >= _minSegment) {
                out.add(build(i, j, _maxSegment));
              }
              i = j + 1;
            }

            if (out.isEmpty) {
              // Nothing passed the filters: keep the best stretch so the clip isn't lost.
              out.add(build(0, n - 1, _fallbackLen));
            }
            return out.where((s) => s.duration >= 0.8).toList();
          }
          EOF_1
          cat > lib/text_overlay.dart <<'EOF_2'
          import 'dart:io';
          import 'dart:math';
          import 'dart:ui' as ui;

          import 'package:flutter/material.dart';

          /// Layout is done in the 1080x1920 output space.
          const double kW = 1080;
          const double kH = 1920;
          const double kTitleSize = 72;
          const double kCaptionSize = 44;
          const double kTextMaxW = 880;
          const double kGap = 18;
          const double kPad = 20; // room for the text shadow around each image

          /// What the user chose: texts plus one shared on-screen position.
          class OverlayOptions {
            final List<String> titles;
            final List<String> captions;

            /// Horizontal centre and top of the block, as fractions of the frame.
            final double ax, ay;

            const OverlayOptions(this.titles, this.captions, this.ax, this.ay);

            bool get isEmpty => titles.isEmpty && captions.isEmpty;
          }

          /// One piece of text, placed in output pixels.
          class OverlayItem {
            final String text;
            final bool title;
            final int index; // position within its own list
            final Size size; // image size incl. padding
            final Offset pos; // top-left of the image
            const OverlayItem(this.text, this.title, this.index, this.size, this.pos);
          }

          TextStyle overlayStyle(bool title, [double scale = 1]) => TextStyle(
                fontSize: (title ? kTitleSize : kCaptionSize) * scale,
                fontWeight: title ? FontWeight.w800 : FontWeight.w500,
                color: Colors.white,
                height: 1.15,
                shadows: [
                  Shadow(
                      blurRadius: 8 * scale,
                      color: Colors.black.withValues(alpha: 0.85),
                      offset: Offset(2 * scale, 2 * scale)),
                ],
              );

          TextPainter _painter(String text, bool title) => TextPainter(
                text: TextSpan(text: text, style: overlayStyle(title)),
                textAlign: TextAlign.center,
                textDirection: TextDirection.ltr,
              )..layout(maxWidth: kTextMaxW);

          Size _measure(String text, bool title) {
            final tp = _painter(text, title);
            return Size(tp.width.ceilToDouble() + 2 * kPad,
                tp.height.ceilToDouble() + 2 * kPad);
          }

          /// Every title shares one spot. Captions sit right below the tallest title,
          /// so they never move or overlap when titles change.
          List<OverlayItem> layoutOverlay(
              List<String> titles, List<String> captions, double ax, double ay) {
            final ts = [for (final t in titles) _measure(t, true)];
            final cs = [for (final c in captions) _measure(c, false)];
            final titleH = ts.fold(0.0, (a, s) => max(a, s.height));
            final capH = cs.fold(0.0, (a, s) => max(a, s.height));
            final gap = ts.isNotEmpty && cs.isNotEmpty ? kGap : 0.0;
            final blockH = titleH + gap + capH;
            final top = (ay * kH).clamp(0.0, max(0.0, kH - blockH)).toDouble();

            double left(Size s) =>
                (ax * kW - s.width / 2).clamp(0.0, max(0.0, kW - s.width)).toDouble();

            return [
              for (var i = 0; i < titles.length; i++)
                OverlayItem(titles[i], true, i, ts[i], Offset(left(ts[i]), top)),
              for (var i = 0; i < captions.length; i++)
                OverlayItem(captions[i], false, i, cs[i],
                    Offset(left(cs[i]), top + titleH + gap)),
            ];
          }

          /// Draws the text onto a transparent PNG using Flutter's own text engine,
          /// so every script (including Malayalam) is shaped correctly.
          Future<void> renderTextPng(OverlayItem it, String path) async {
            final tp = _painter(it.text, it.title);
            final rec = ui.PictureRecorder();
            final canvas = Canvas(rec);
            tp.paint(canvas, const Offset(kPad, kPad));
            final image = await rec
                .endRecording()
                .toImage(it.size.width.toInt(), it.size.height.toInt());
            final data = await image.toByteData(format: ui.ImageByteFormat.png);
            await File(path).writeAsBytes(data!.buffer.asUint8List());
          }
          EOF_2
          cat > lib/reel_maker.dart <<'EOF_3'
          import 'dart:io';
          import 'dart:math';

          import 'package:ffmpeg_kit_flutter_new/ffmpeg_kit.dart';
          import 'package:ffmpeg_kit_flutter_new/return_code.dart';
          import 'package:path_provider/path_provider.dart';

          import 'analyzer.dart';
          import 'text_overlay.dart';

          typedef Progress = void Function(String message, double fraction);

          /// Reel settings. Tweak freely.
          const int outW = 1080;
          const int outH = 1920; // 9:16 for Reels / Shorts
          const int fps = 30;
          const double transitionSecs = 0.6;
          const double maxReelSecs = 60; // longest reel allowed

          /// Soft, gentle blends only (no sliding or wiping).
          const _transitions = ['fade', 'dissolve', 'fadegrays'];

          class ReelMaker {
            bool _useHardwareEncoder = false;

            List<String> _videoEncoder() => _useHardwareEncoder
                ? ['-c:v', 'h264_mediacodec', '-b:v', '8M']
                : ['-c:v', 'libx264', '-preset', 'veryfast', '-crf', '20'];

            /// Runs ffmpeg; if the software encoder is missing, retries once with
            /// Android's hardware H.264 encoder.
            Future<bool> _run(List<String> Function() args) async {
              var s = await FFmpegKit.executeWithArguments(args());
              if (ReturnCode.isSuccess(await s.getReturnCode())) return true;
              if (!_useHardwareEncoder) {
                _useHardwareEncoder = true;
                s = await FFmpegKit.executeWithArguments(args());
                return ReturnCode.isSuccess(await s.getReturnCode());
              }
              return false;
            }

            String _t(double v) => v.toStringAsFixed(3);

            /// Full pipeline. Returns the path of the finished reel.
            Future<String> make(
                List<String> clips, OverlayOptions? overlay, Progress onProgress) async {
              final tmp = await getTemporaryDirectory();
              final work = Directory('${tmp.path}/reel_work')..createSync(recursive: true);
              for (final f in work.listSync()) {
                f.deleteSync(recursive: true);
              }

              // 1) Find the good parts of every clip.
              var segments = <Segment>[];
              for (var i = 0; i < clips.length; i++) {
                onProgress('Analysing clip ${i + 1} of ${clips.length}…',
                    0.05 + 0.20 * i / clips.length);
                segments.addAll(await analyzeClip(clips[i], work, i));
              }
              if (segments.isEmpty) {
                throw Exception('No usable video found in the selected clips.');
              }

              // 2) Respect the max reel length: drop the weakest segments first.
              double total(List<Segment> l) => l.fold(0.0, (a, s) => a + s.duration);
              final ranked = [...segments]..sort((a, b) => a.score.compareTo(b.score));
              while (total(segments) > maxReelSecs && segments.length > 1) {
                segments.remove(ranked.removeAt(0));
              }

              // 3) Match lighting across clips: pull each segment toward the shared average.
              final target =
                  segments.fold(0.0, (a, s) => a + s.brightness) / segments.length;

              // 4) Re-encode each segment to the same size/fps with colour enhancement.
              final parts = <String>[];
              final durations = <double>[];
              for (var i = 0; i < segments.length; i++) {
                onProgress('Enhancing part ${i + 1} of ${segments.length}…',
                    0.25 + 0.40 * i / segments.length);
                final s = segments[i];
                final out = '${work.path}/part_$i.mp4';
                final gain = ((target - s.brightness) / 255 * 0.5).clamp(-0.12, 0.12);
                final vf = 'scale=$outW:$outH:force_original_aspect_ratio=increase,'
                    'crop=$outW:$outH,setsar=1,fps=$fps,'
                    'eq=brightness=${gain.toStringAsFixed(3)}:contrast=1.08:saturation=1.18,'
                    'unsharp=5:5:0.5:5:5:0.0,format=yuv420p';
                final d = _t(s.duration);
                final fadeOut = _t(s.duration - 0.05);
                final af = 'aresample=44100,aformat=channel_layouts=stereo,'
                    'afade=t=in:d=0.05,afade=t=out:st=$fadeOut:d=0.05';

                final ok = await _run(() => [
                      '-y',
                      '-ss', _t(s.start), '-t', d, '-i', s.clip,
                      if (!s.hasAudio) ...[
                        '-f', 'lavfi', '-t', d, '-i', 'anullsrc=r=44100:cl=stereo',
                      ],
                      '-vf', vf,
                      if (s.hasAudio) ...['-af', af],
                      if (!s.hasAudio) ...['-map', '0:v', '-map', '1:a', '-shortest'],
                      ..._videoEncoder(),
                      '-c:a', 'aac', '-b:a', '128k', '-ar', '44100', '-ac', '2',
                      out,
                    ]);
                if (!ok) throw Exception('Could not process part ${i + 1}.');
                parts.add(out);
                durations.add(await probeDuration(out));
              }

              // 5) Join with soft transitions.
              final stamp = DateTime.now().millisecondsSinceEpoch;
              final joined = '${work.path}/joined.mp4';
              onProgress('Adding transitions…', 0.68);
              if (parts.length == 1) {
                await File(parts.first).copy(joined);
              } else {
                final v = StringBuffer(), a = StringBuffer();
                var merged = durations[0]; // length of everything joined so far
                var vPrev = '0:v', aPrev = '0:a';
                for (var i = 1; i < parts.length; i++) {
                  final t = transitionSecs;
                  final offset = _t(merged - t);
                  final vOut = i == parts.length - 1 ? 'vout' : 'v$i';
                  final aOut = i == parts.length - 1 ? 'aout' : 'a$i';
                  final name = _transitions[(i - 1) % _transitions.length];
                  v.write('[$vPrev][$i:v]xfade=transition=$name:duration=$t:offset=$offset[$vOut];');
                  a.write('[$aPrev][$i:a]acrossfade=d=$t[$aOut];');
                  vPrev = vOut;
                  aPrev = aOut;
                  merged += durations[i] - t;
                }
                final filter = '$v${a.toString().replaceFirst(RegExp(r';$'), '')}';
                final ok = await _run(() => [
                      '-y',
                      for (final p in parts) ...['-i', p],
                      '-filter_complex', filter,
                      '-map', '[vout]', '-map', '[aout]',
                      ..._videoEncoder(),
                      '-pix_fmt', 'yuv420p',
                      '-c:a', 'aac', '-b:a', '160k',
                      '-movflags', '+faststart',
                      joined,
                    ]);
                if (!ok) throw Exception('Could not join the clips.');
              }

              // 6) Titles and captions (one at a time, soft fade + small rise).
              final reel = '${tmp.path}/reel_$stamp.mp4';
              if (overlay != null && !overlay.isEmpty) {
                onProgress('Adding titles…', 0.85);
                await _addText(joined, overlay, work, reel);
              } else {
                await File(joined).copy(reel);
              }

              onProgress('Done', 1.0);
              work.deleteSync(recursive: true);
              return reel;
            }

            /// Each title/caption gets an equal share of the reel's length. Within its
            /// share it fades in while rising slightly, then fades out, so changing
            /// from one text to the next looks gentle.
            Future<void> _addText(
                String input, OverlayOptions o, Directory work, String out) async {
              final total = await probeDuration(input);
              final items = layoutOverlay(o.titles, o.captions, o.ax, o.ay);

              final extra = <String>[];
              final f = StringBuffer();
              var cur = '0:v';
              for (var k = 0; k < items.length; k++) {
                final it = items[k];
                final count = it.title ? o.titles.length : o.captions.length;
                final slot = total / count;
                final start = slot * it.index;
                final end = start + slot;
                final fd = min(0.4, slot / 3);
                final png = '${work.path}/txt_$k.png';
                await renderTextPng(it, png);

                extra.addAll(['-loop', '1', '-framerate', '$fps', '-t', _t(slot), '-i', png]);
                f.write('[${k + 1}:v]format=rgba,'
                    'fade=t=in:st=0:d=${_t(fd)}:alpha=1,'
                    'fade=t=out:st=${_t(slot - fd)}:d=${_t(fd)}:alpha=1,'
                    'setpts=PTS+${_t(start)}/TB[o$k];');
                f.write("[$cur][o$k]overlay=x=${it.pos.dx.round()}"
                    ":y='${it.pos.dy.round()}+24*max(0,1-(t-${_t(start)})/${_t(fd)})'"
                    ":eval=frame:enable='between(t,${_t(start)},${_t(end)})'[c$k];");
                cur = 'c$k';
              }
              f.write('[$cur]format=yuv420p[vout]');

              final ok = await _run(() => [
                    '-y',
                    '-i', input,
                    ...extra,
                    '-filter_complex', f.toString(),
                    '-map', '[vout]', '-map', '0:a?',
                    ..._videoEncoder(),
                    '-pix_fmt', 'yuv420p',
                    '-c:a', 'copy',
                    '-movflags', '+faststart',
                    out,
                  ]);
              if (!ok) throw Exception('Could not add titles.');
            }
          }
          EOF_3
          cat > lib/main.dart <<'EOF_4'
          import 'dart:io';

          import 'package:flutter/material.dart';
          import 'package:gal/gal.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:video_player/video_player.dart';

          import 'reel_maker.dart';
          import 'text_overlay.dart';

          const int maxClips = 20;

          void main() => runApp(const ReelApp());

          class ReelApp extends StatelessWidget {
            const ReelApp({super.key});

            @override
            Widget build(BuildContext context) => MaterialApp(
                  title: 'Reel Maker',
                  debugShowCheckedModeBanner: false,
                  theme: ThemeData(
                    colorSchemeSeed: Colors.deepPurple,
                    brightness: Brightness.dark,
                    useMaterial3: true,
                  ),
                  home: const Home(),
                );
          }

          class Home extends StatefulWidget {
            const Home({super.key});

            @override
            State<Home> createState() => _HomeState();
          }

          class _HomeState extends State<Home> {
            final clips = <String>[];
            final titles = <String>[];
            final captions = <String>[];
            final titleCtl = TextEditingController();
            final captionCtl = TextEditingController();

            /// Shared position of the text block (centre x, top y) as frame fractions.
            double ax = 0.5, ay = 0.70;

            bool busy = false;
            String status = '';
            double progress = 0;
            String? output;
            VideoPlayerController? player;

            Future<void> pick() async {
              final files = await ImagePicker().pickMultiVideo();
              if (files.isEmpty) return;
              setState(() {
                for (final f in files) {
                  if (clips.length < maxClips && !clips.contains(f.path)) {
                    clips.add(f.path);
                  }
                }
              });
            }

            void addText(List<String> list, TextEditingController c) {
              final t = c.text.trim();
              if (t.isEmpty) return;
              setState(() => list.add(t));
              c.clear();
            }

            Future<void> make() async {
              setState(() {
                busy = true;
                output = null;
                progress = 0;
              });
              await player?.dispose();
              player = null;
              try {
                final opts = OverlayOptions(
                    List.of(titles), List.of(captions), ax, ay);
                final path = await ReelMaker().make(clips, opts, (m, f) {
                  if (mounted) {
                    setState(() {
                      status = m;
                      progress = f;
                    });
                  }
                });
                setState(() => status = 'Saving to gallery…');
                await Gal.putVideo(path);
                final c = VideoPlayerController.file(File(path));
                await c.initialize();
                c.setLooping(true);
                c.play();
                setState(() {
                  output = path;
                  player = c;
                  status = 'Saved to your gallery ✔';
                });
              } catch (e) {
                setState(() => status = 'Error: $e');
              } finally {
                setState(() => busy = false);
              }
            }

            @override
            void dispose() {
              player?.dispose();
              titleCtl.dispose();
              captionCtl.dispose();
              super.dispose();
            }

            // ---------- UI pieces ----------

            Widget section(String text) => Padding(
                  padding: const EdgeInsets.only(top: 20, bottom: 8),
                  child: Text(text, style: Theme.of(context).textTheme.titleMedium),
                );

            Widget textEditor(String hint, List<String> list, TextEditingController c) {
              return Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  Row(children: [
                    Expanded(
                      child: TextField(
                        controller: c,
                        enabled: !busy,
                        decoration: InputDecoration(
                          hintText: hint,
                          border: const OutlineInputBorder(),
                          isDense: true,
                        ),
                        onSubmitted: (_) => addText(list, c),
                      ),
                    ),
                    const SizedBox(width: 8),
                    IconButton.filled(
                      onPressed: busy ? null : () => addText(list, c),
                      icon: const Icon(Icons.add),
                    ),
                  ]),
                  if (list.isNotEmpty)
                    Padding(
                      padding: const EdgeInsets.only(top: 8),
                      child: Wrap(
                        spacing: 8,
                        runSpacing: 4,
                        children: [
                          for (var i = 0; i < list.length; i++)
                            InputChip(
                              label: Text('${i + 1}. ${list[i]}',
                                  overflow: TextOverflow.ellipsis),
                              onDeleted: busy ? null : () => setState(() => list.removeAt(i)),
                            ),
                        ],
                      ),
                    ),
                ],
              );
            }

            /// A small 9:16 frame. Drag anywhere in it to move the title+caption block.
            Widget positionPicker() {
              final tl = titles.isEmpty && captions.isEmpty ? ['Your title'] : titles;
              final cl = titles.isEmpty && captions.isEmpty ? ['Your caption'] : captions;
              return Center(
                child: SizedBox(
                  width: 200,
                  child: AspectRatio(
                    aspectRatio: kW / kH,
                    child: LayoutBuilder(builder: (context, box) {
                      final s = box.maxWidth / kW;
                      final items = layoutOverlay(tl, cl, ax, ay);
                      return GestureDetector(
                        onPanUpdate: busy
                            ? null
                            : (d) => setState(() {
                                  ax = (ax + d.delta.dx / box.maxWidth).clamp(0.0, 1.0).toDouble();
                                  ay = (ay + d.delta.dy / box.maxHeight).clamp(0.0, 1.0).toDouble();
                                }),
                        child: ClipRRect(
                          borderRadius: BorderRadius.circular(8),
                          child: Stack(children: [
                            Positioned.fill(
                              child: Container(
                                color: Colors.black,
                                alignment: Alignment.topCenter,
                                padding: const EdgeInsets.only(top: 6),
                                child: const Text('drag to position',
                                    style: TextStyle(fontSize: 10, color: Colors.white38)),
                              ),
                            ),
                            for (final it in items.where((i) => i.index == 0))
                              Positioned(
                                left: (it.pos.dx + kPad) * s,
                                top: (it.pos.dy + kPad) * s,
                                width: (it.size.width - 2 * kPad) * s,
                                child: Text(it.text,
                                    textAlign: TextAlign.center,
                                    style: overlayStyle(it.title, s)),
                              ),
                          ]),
                        ),
                      );
                    }),
                  ),
                ),
              );
            }

            Widget clipList() {
              if (clips.isEmpty) {
                return const Padding(
                  padding: EdgeInsets.symmetric(vertical: 12),
                  child: Center(child: Text('Add any number of clips to start.')),
                );
              }
              return ReorderableListView(
                shrinkWrap: true,
                physics: const NeverScrollableScrollPhysics(),
                onReorder: busy
                    ? (_, __) {}
                    : (a, b) => setState(() {
                          if (b > a) b--;
                          clips.insert(b, clips.removeAt(a));
                        }),
                children: [
                  for (final c in clips)
                    ListTile(
                      key: ValueKey(c),
                      dense: true,
                      leading: const Icon(Icons.movie),
                      title: Text(c.split('/').last, overflow: TextOverflow.ellipsis),
                      trailing: IconButton(
                        icon: const Icon(Icons.close),
                        onPressed: busy ? null : () => setState(() => clips.remove(c)),
                      ),
                    ),
                ],
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Reel Maker')),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Row(children: [
                      Expanded(
                        child: FilledButton.tonalIcon(
                          onPressed: busy ? null : pick,
                          icon: const Icon(Icons.video_library),
                          label: Text('Add clips (${clips.length}/$maxClips)'),
